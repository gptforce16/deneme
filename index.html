<!DOCTYPE html>
<html lang="tr" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metraj Hazırlama Programı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
    .bg-grid-pattern {
      background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 30px 30px;
    }
    .text-gradient {
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-image: linear-gradient(to right, #60a5fa, #a78bfa);
    }
    .module-card {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .module-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px -10px rgba(0, 0, 0, 0.45);
    }
    /* Dolgusuz, Siyah Yazılı Sade Girdi Stili */
    .pink-red-cell {
      background-color: #FFFFFF !important;
      color: #000000 !important;
      font-weight: 600 !important;
      font-family: 'JetBrains Mono', monospace;
    }
    .pink-red-input {
      background-color: #FFFFFF !important;
      color: #000000 !important;
      font-weight: 500 !important;
      border: 1px solid #CBD5E1 !important;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.15s ease;
    }
    .pink-red-input:hover {
      border-color: #94A3B8 !important;
    }
    .pink-red-input:focus {
      outline: none;
      border-color: #2563EB !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      background-color: #FFFFFF !important;
    }
    /* Excel Grid Görünümü */
    .excel-grid {
      border-collapse: collapse;
      width: 100%;
      background-color: #FFFFFF;
      font-size: 12px;
      color: #000000;
    }
    .excel-grid th, .excel-grid td {
      border: 1px solid #CBD5E1;
      padding: 5px 8px;
      vertical-align: middle;
    }
    .excel-col-header {
      background-color: #F1F5F9;
      color: #000000;
      font-weight: 700;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      user-select: none;
    }
    .excel-row-header {
      background-color: #F1F5F9;
      color: #000000;
      font-weight: 600;
      text-align: center;
      width: 38px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      user-select: none;
    }
    .formula-tag {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #2563EB;
      line-height: 1.15;
      margin-top: 2px;
    }
    .cell-a2 {
      background-color: #F1F5F9;
      font-weight: 700;
      color: #000000;
    }
    .row-pos-header {
      background-color: #F8FAFC;
      font-weight: 700;
    }
    .row-toplam {
      background-color: #F8FAFC;
      font-weight: 700;
      color: #000000;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-900 text-black flex flex-col min-h-screen relative overflow-x-hidden">

  <!-- ARKA PLAN GRID & IŞIK EFEKTİ (GeoLog Pro Tarzı) -->
  <div class="fixed inset-0 bg-grid-pattern opacity-60 z-0 pointer-events-none"></div>
  <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[350px] h-[350px] md:w-[900px] md:h-[550px] bg-blue-600/10 blur-[100px] md:blur-[130px] rounded-full pointer-events-none z-0"></div>

  <!-- ÜST NAVİGASYON -->
  <nav class="relative z-30 w-full py-4 px-4 md:px-8 flex flex-wrap justify-center items-center gap-4 md:gap-6 max-w-[1640px] mx-auto border-b border-white/10">
    <div class="bg-gradient-to-br from-slate-700 via-slate-800 to-slate-950 p-2.5 rounded-xl shadow-lg shadow-black/50 text-white flex items-center justify-center border border-slate-500/40" title="Metraj Hazırlama Programı">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
        <rect x="3" y="3" width="18" height="18" rx="3" />
        <path d="M3 9h18" />
        <path d="M9 21V9" />
        <path d="M13 13h4" />
        <path d="M13 17h4" />
      </svg>
    </div>

    <div class="flex items-center bg-slate-800/80 backdrop-blur border border-slate-700 rounded-xl px-3.5 py-2">
      <i class="fa-solid fa-folder text-slate-400 text-xs mr-2.5"></i>
      <input id="projectTitleInput" type="text" value="İşin Adı" placeholder="İşin Adı"
             onfocus="if(this.value==='İşin Adı'){this.value=''; updateProjectTitle('');}"
             onblur="if(this.value.trim()===''){this.value='İşin Adı'; updateProjectTitle('İşin Adı');}"
             oninput="updateProjectTitle(this.value)"
             class="bg-transparent text-xs font-bold text-white w-48 sm:w-64 focus:outline-none placeholder-slate-400 text-center sm:text-left" />
    </div>

    <button onclick="exportAllToExcel()"
            class="bg-slate-800/80 hover:bg-slate-700 backdrop-blur border border-slate-700 text-white px-4 py-2 rounded-xl text-xs font-semibold transition-all duration-200 flex items-center gap-2 cursor-pointer">
      <i class="fa-solid fa-download"></i>
      <span>Excel İndir (.xlsx)</span>
    </button>
  </nav>

  <!-- ANA ÇALIŞMA ALANI -->
  <main class="flex-grow w-full max-w-[1640px] mx-auto px-4 md:px-8 py-5 relative z-20 grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">

    <!-- SOL PANEL: BİRİM METRAJ EKLEME VE KIRMIZI DEĞER GİRİŞLERİ (4 SÜTUN) -->
    <aside class="lg:col-span-4 space-y-3.5">

      <!-- Birim Metraj Ekleme Kutusu -->
      <div class="bg-slate-800/75 backdrop-blur-md border border-slate-700/70 rounded-2xl p-3.5 shadow-xl">
        <div class="flex items-center gap-2">
          <select id="newModuleTypeSelect" class="flex-1 bg-slate-900/90 border border-slate-600 rounded-xl px-3 py-2 text-xs font-bold text-white focus:outline-none focus:border-blue-500">
            <option value="hat">Hat</option>
            <option value="hat_gomlek">Hat (Gömleklemeli)</option>
            <option value="su_alim">Su Alım Yapısı</option>
            <option value="sulama">Sulama Aparatı</option>
            <option value="sulama_vantuz">Sulama Aparatı+Vantuz</option>
          </select>
          <button onclick="addModuleFromDropdown()"
                  class="bg-slate-800/80 hover:bg-slate-700 backdrop-blur border border-slate-700 text-white px-4 py-2 rounded-xl font-semibold text-xs transition cursor-pointer shrink-0 flex items-center gap-1.5">
            <i class="fa-solid fa-plus"></i>
            <span>Ekle</span>
          </button>
        </div>
      </div>

      <!-- Eklenen Birim Metraj Kutucukları -->
      <div id="moduleListContainer" class="space-y-3"></div>

    </aside>

    <!-- SAĞ PANEL: ORİJİNAL EXCEL YAPISINDA SEKME VE TABLOLAR (8 SÜTUN) -->
    <section class="lg:col-span-8 bg-white rounded-2xl shadow-2xl border border-slate-200/60 overflow-hidden flex flex-col">

      <!-- Excel Sayfa Sekmeleri -->
      <div id="sheetTabsBar" class="bg-slate-800 border-b border-slate-700 px-3 pt-2 flex flex-wrap items-center gap-1.5"></div>

      <!-- Aktif Excel Sayfası Tablosu -->
      <div id="spreadsheetViewport" class="overflow-x-auto overflow-y-auto max-h-[80vh] bg-white"></div>

    </section>

  </main>

  <!-- ALT BİLGİ -->
  <footer class="relative z-20 w-full border-t border-white/10 py-3 mt-auto bg-slate-900/50 backdrop-blur-sm">
    <div class="max-w-[1640px] mx-auto px-4 md:px-8 flex justify-center items-center">
      <p class="text-slate-500 text-[11px] font-medium">Genel ve Birim Metraj Otomasyonu</p>
    </div>
  </footer>

        { row: 21, no: 1, cap: "Ø12/25", p: 1.5, pF: "1.5", q: (F6 / 0.25 + 1) * 2, qF: "=((O6+P6+Q6)/0.25+1)*2" },

        { row: 29, no: 9, cap: "Ø12/25", p: Q6 + 0.85, pF: "=Q6+0.85", q: 4, qF: "4" },
        { row: 30, no: 10, cap: "Ø12/25", p: N6 - 0.1, pF: "=N6-0.1", q: 2, qF: "2" },
        { row: 31, no: 11, cap: "Ø12/25", p: 5.35, pF: "5.35", q: (N6 / 0.25 + 1) * 4 - 6, qF: "=(N6/0.25+1)*4-6" },
        { row: 32, no: 12, cap: "Ø12/25", p: 4.6, pF: "4.6", q: 6, qF: "6" },
        { row: 33, no: 13, cap: "Ø12/25", p: 0.6, pF: "0.6", q: 6, qF: "6" },

    function calcSulamaModule(mod, isVantuz) {
      const M3 = Number(mod.inputs.M3) || 0;
      const M4 = Number(mod.inputs.M4) || 0;
      const M5 = Number(mod.inputs.M5) || 0;

      const A2 = M3 ? `Ø${M3} HAT ÜZERİNDE SULAMA APARATI DÖŞENMESİ` : MODULE_TYPE_META[mod.type].label;
      const pMain = lookupPipe(M3, M4);
      const p110 = lookupPipe(110, M4);

      const B25 = isVantuz ? "ST.465" : "ST.464";
      const C26Label = isVantuz ? "Vantuzlu Sulama Aparatı" : "Sulama Aparatı";
      const B34 = pMain && pMain.tee_st ? pMain.tee_st : "";
      const B37 = pMain && pMain.weld_st ? pMain.weld_st : "";
      const B40 = p110 && p110.weld_st ? p110.weld_st : "";

      const I21 = -M5 * 0.6 * 0.6 * 0.2;
      const I22 = -M5 * 3.14 * 0.11 * 0.11 / 4 * 0.8;
      const J20 = I21 + I22;

      const I26 = M5 * 1; const J25 = I26;
      const I29 = M5 * 1; const J28 = I29;
      const I32 = M5 * 1; const J31 = I32;
      const I35 = M5 * 1; const J34 = I35;
      const I38 = M5 * 2; const J37 = I38;
      const I41 = M5 * 1; const J40 = I41;
      const I44 = M5 * 0.6 * 0.6 * 0.2; const J43 = I44;
      const I47 = M5 * 0.6 * 0.2 * 4; const J46 = I47;
      const E50 = 0.6 * 0.6 * 0.2;
      const I50 = M5 * 0.3 * E50; const J49 = I50;
      const E53 = 0.6 * 0.6 * 0.2;
      const I53 = M5 * 1.3 * E53 * 1.6; const J52 = I53;

      const contributions = [
        { st: "ST.2", qty: J20, cellRef: "J20" },
        { st: B25, qty: J25, cellRef: "J25" },
        { st: "ST.193", qty: J28, cellRef: "J28" },
        { st: "ST.243", qty: J31, cellRef: "J31" },
        { st: B34, qty: J34, cellRef: "J34" },
        { st: B37, qty: J37, cellRef: "J37" },
        { st: B40, qty: J40, cellRef: "J40" },
        { st: "ST.5", qty: J43, cellRef: "J43" },
        { st: "ST.11", qty: J46, cellRef: "J46" },
        { st: "ST.475", qty: J49, cellRef: "J49" },
        { st: "ST.473", qty: J52, cellRef: "J52" }
      ];

      return {
        A2,
        A2Formula: '=CONCATENATE("Ø",M3," HAT ÜZERİNDE SULAMA APARATI DÖŞENMESİ")',
        M3, M4, M5,
        B25, C26Label, B34, B37, B40,
        I21, I22, J20,
        I26, J25, I29, J28, I32, J31, I35, J34, I38, J37, I41, J40,
        I44, J43, I47, J46, E50, I50, J49, E53, I53, J52,
        contributions
      };
    }

    function computeAll() {
      assignCodesAndSheetNames();
      const modResults = {};

      unitModules.forEach(mod => {
        if (mod.type === "hat") modResults[mod.id] = calcHatModule(mod);
        else if (mod.type === "hat_gomlek") modResults[mod.id] = calcHatGomlekModule(mod);
        else if (mod.type === "su_alim") modResults[mod.id] = calcSuAlimModule(mod);
        else if (mod.type === "sulama") modResults[mod.id] = calcSulamaModule(mod, false);
        else if (mod.type === "sulama_vantuz") modResults[mod.id] = calcSulamaModule(mod, true);
      });

      // Genel Metraj: Her benzersiz ST pozu için sıfır olmayan birim metraj katkıları
      const stMap = {};
      const stList = [];

      unitModules.forEach(mod => {
        const res = modResults[mod.id];
        // Aynı birim metraj içinde aynı ST kodu birden fazla geçerse (örn. R6=110 ve S6=110) hücre referanslarını birleştir
        const perModSt = {};
        res.contributions.forEach(c => {
          if (!c.st || !ST_DICT[c.st]) return;
          const q = Number(c.qty) || 0;
          if (Math.abs(q) < 1e-9) return;
          if (!perModSt[c.st]) {
            perModSt[c.st] = { qty: 0, refs: [] };
          }
          perModSt[c.st].qty += q;
          perModSt[c.st].refs.push(`'${mod.sheetName}'!${c.cellRef}`);
        });

        Object.entries(perModSt).forEach(([stCode, data]) => {
          if (Math.abs(data.qty) < 1e-9) return;
          if (!stMap[stCode]) {
            const info = getStInfo(stCode);
            stMap[stCode] = {
              st: stCode,
              name: info.name,
              unit: info.unit,
              subRows: []
            };
            stList.push(stCode);
          }
          stMap[stCode].subRows.push({
            modId: mod.id,
            letter: mod.letter,
            sheetName: mod.sheetName,
            a2Value: res.A2,
            a2Formula: `='${mod.sheetName}'!A2`,
            qty: data.qty,
            qtyFormula: "=" + data.refs.join("+")
          });
        });
      });

      stList.sort((a, b) => {
        const na = parseInt(a.replace("ST.", ""), 10) || 9999;
        const nb = parseInt(b.replace("ST.", ""), 10) || 9999;
        return na - nb;
      });

      let currentExcelRow = 5;
      const genelBlocks = stList.map((stCode, idx) => {
        const item = stMap[stCode];
        const mainRow = currentExcelRow;
        const firstSubRow = mainRow + 1;
        const lastSubRow = mainRow + item.subRows.length;
        currentExcelRow = lastSubRow + 1;

        const exactTotal = item.subRows.reduce((s, r) => s + r.qty, 0);
        const roundedQty = excelRoundUp(exactTotal);

        return {
          sira: idx + 1,
          st: item.st,
          name: item.name,
          unit: item.unit,
          mainRow,
          firstSubRow,
          lastSubRow,
          subRows: item.subRows.map((sr, sIdx) => ({
            ...sr,
            excelRow: firstSubRow + sIdx
          })),
          exactTotal,
          roundedQty
        };
      });

      return { modResults, genelBlocks };
    }

    function renderSpreadsheetViewport(computed) {
      const vp = document.getElementById("spreadsheetViewport");
      if (activeTabId === "genel") {
        vp.innerHTML = renderGenelMetrajGrid(computed);
        return;
      }
      const mod = unitModules.find(m => m.id === activeTabId);
      if (!mod) {
        activeTabId = "genel";
        vp.innerHTML = renderGenelMetrajGrid(computed);
        return;
      }
      const res = computed.modResults[mod.id];
      if (mod.type === "hat") vp.innerHTML = renderHatGrid(mod, res);
      else if (mod.type === "hat_gomlek") vp.innerHTML = renderHatGomlekGrid(mod, res);
      else if (mod.type === "su_alim") vp.innerHTML = renderSuAlimGrid(mod, res);
      else vp.innerHTML = renderSulamaGrid(mod, res);
    }

    // ============================================================================
    // ETKİLEŞİM FONKSİYONLARI
    // ============================================================================
    function renderAll() {
      const computed = computeAll();
      renderModuleBoxes(computed);
      renderSheetTabs(computed);
      renderSpreadsheetViewport(computed);
    }

    function addModuleFromDropdown() {
      const sel = document.getElementById("newModuleTypeSelect");
      const type = sel ? sel.value : "hat";
      const newId = "m" + (nextIdCounter++);
      unitModules.push({
        id: newId,
        type,
        inputs: defaultInputsForType(type)
      });
      renderAll();
    }

    function removeModule(id) {
      unitModules = unitModules.filter(m => m.id !== id);
      if (activeTabId === id) activeTabId = "genel";
      renderAll();
    }

    function changeModuleType(id, newType) {
      const mod = unitModules.find(m => m.id === id);
      if (!mod) return;
      mod.type = newType;
      mod.inputs = defaultInputsForType(newType);
      renderAll();
    }

    function updateModInput(id, field, val) {
      const mod = unitModules.find(m => m.id === id);
      if (!mod) return;
      mod.inputs[field] = val === "" ? "" : Number(val);
      const computed = computeAll();
      const a2El = document.getElementById(`a2Box_${id}`);
      if (a2El) a2El.textContent = computed.modResults[id].A2;
      renderSheetTabs(computed);
      renderSpreadsheetViewport(computed);
    }

    function switchTab(tabId) {
      activeTabId = tabId;
      renderAll();
    }

    function updateProjectTitle(val) {
      projectTitle = val;
      const computed = computeAll();
      renderSpreadsheetViewport(computed);
    }

    // ============================================================================
    // GERÇEK FORMÜLLÜ VE HÜCRE TAŞIMALI EXCEL (.XLSX) OLUŞTURUCU
    // ============================================================================
    function setCell(ws, r1, c1, val, formula = null, type = null) {
      const ref = XLSX.utils.encode_cell({ r: r1 - 1, c: c1 - 1 });
      if (formula) {
        const fClean = formula.startsWith("=") ? formula.slice(1) : formula;
        const isNum = typeof val === "number";
        ws[ref] = {
          t: type || (isNum ? "n" : "s"),
          f: fClean,
          v: val
        };
      } else if (val !== null && val !== undefined && val !== "") {
        const isNum = typeof val === "number";
        ws[ref] = {
          t: type || (isNum ? "n" : "s"),
          v: val
        };
      }
    }

    function finalizeSheetRange(ws, maxR, maxC) {
      ws["!ref"] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: maxR, c: maxC } });
    }

    // Sağ taraftaki arama tablolarını ve ST sözlüğünü (fiyatsız: yalnız Kod, Ad, Birim) sayfaya ekler
    function embedLookupTablesInSheet(ws, mode) {
      // mode: 'hat' (Q:Y), 'su_alim' (V:AE), 'sulama' (P:Z)
      if (mode === "hat") {
        const headers = ["Çap/Atü", "Ağırlık (kg/m)", "Flanş Çapı", "Boru Döşenmesi", "Alın Kaynağı"];
        headers.forEach((h, i) => setCell(ws, 1, 17 + i, h));
        PIPE_LOOKUP_ROWS.forEach((row, idx) => {
          const r = idx + 2;
          setCell(ws, r, 17, row.key);
          setCell(ws, r, 18, row.weight);
          setCell(ws, r, 19, row.flange_dia);
          setCell(ws, r, 20, row.pipe_st);
          setCell(ws, r, 21, row.weld_st);
        });
        setCell(ws, 1, 23, "Boru Çapı");
        setCell(ws, 1, 24, "Kazı Derinliği");
        setCell(ws, 1, 25, "Kazı Genişliği");
        TRENCH_LOOKUP.forEach((tr, idx) => {
          const r = idx + 2;
          setCell(ws, r, 23, tr.dia);
          setCell(ws, r, 24, tr.depth);
          setCell(ws, r, 25, tr.width);
        });
      } else if (mode === "su_alim") {
        const headers = ["Çap/Atü", "Ağırlık (kg/m)", "PE Çap", "Flanş Çapı", "Boru Döşenmesi", "Alın Kaynağı", "Flanş Adaptörü", "Baş Bağlama", "Vana", "Krepin"];
        headers.forEach((h, i) => setCell(ws, 1, 22 + i, h));
        PIPE_LOOKUP_ROWS.forEach((row, idx) => {
          const r = idx + 2;
          setCell(ws, r, 22, row.key);
          setCell(ws, r, 23, row.weight);
          setCell(ws, r, 24, row.pe_dia);
          setCell(ws, r, 25, row.flange_dia);
          setCell(ws, r, 26, row.pipe_st);
          setCell(ws, r, 27, row.weld_st);
          setCell(ws, r, 28, row.adaptor_st);
          setCell(ws, r, 29, row.head_st);
          setCell(ws, r, 30, row.valve_st);
          setCell(ws, r, 31, row.strainer_st);
        });
      } else if (mode === "sulama") {
        const headers = ["Çap/Atü", "Ağırlık (kg/m)", "PE Çap", "Flanş Çapı", "Boru Döşenmesi", "Alın Kaynağı", "Flanş Adaptörü", "Baş Bağlama", "Vana", "Krepin", "TE PARÇASI"];
        headers.forEach((h, i) => setCell(ws, 1, 16 + i, h));
        PIPE_LOOKUP_ROWS.forEach((row, idx) => {
          const r = idx + 2;
          setCell(ws, r, 16, row.key);
          setCell(ws, r, 17, row.weight);
          setCell(ws, r, 18, row.pe_dia);
          setCell(ws, r, 19, row.flange_dia);
          setCell(ws, r, 20, row.pipe_st);
          setCell(ws, r, 21, row.weld_st);
          setCell(ws, r, 22, row.adaptor_st);
          setCell(ws, r, 23, row.head_st);
          setCell(ws, r, 24, row.valve_st);
          setCell(ws, r, 25, row.strainer_st);
          setCell(ws, r, 26, row.tee_st);
        });
      }

      // AF:AH (Cols 32..34) Poz Adı ve Birimi Arama Tablosu (Fiyatsız)
      setCell(ws, 1, 32, "Poz Kodu");
      setCell(ws, 1, 33, "İş Kaleminin Adı");
      setCell(ws, 1, 34, "Birimi");
      Object.entries(ST_DICT).forEach(([code, info], idx) => {
        const r = idx + 2;
        setCell(ws, r, 32, code);
        setCell(ws, r, 33, info.name);
        setCell(ws, r, 34, info.unit);
      });
    }

    function buildGenelMetrajExcelSheet(computed) {
      const ws = {};
      setCell(ws, 1, 3, projectTitle);
      setCell(ws, 2, 3, "GENEL METRAJ TABLOSU");
      setCell(ws, 4, 3, "İş Kaleminin Adı ve Kısa Açıklaması");
      setCell(ws, 4, 4, "Miktarı");
      setCell(ws, 4, 5, "Birimi");

      // AF:AH Poz Adı ve Birimi sözlüğü (Genel Metraj VLOOKUP formüllerinin çalışması için)
      setCell(ws, 1, 32, "Poz Kodu");
      setCell(ws, 1, 33, "İş Kaleminin Adı");
      setCell(ws, 1, 34, "Birimi");
      Object.entries(ST_DICT).forEach(([code, info], idx) => {
        const r = idx + 2;
        setCell(ws, r, 32, code);
        setCell(ws, r, 33, info.name);
        setCell(ws, r, 34, info.unit);
      });

      let lastRow = 12;
      computed.genelBlocks.forEach(b => {
        // Ana satır
        setCell(ws, b.mainRow, 1, b.sira, `=IF(ISBLANK(E${b.mainRow})," ",COUNTA($E$5:E${b.mainRow}))`, "n");
        setCell(ws, b.mainRow, 2, b.st);
        setCell(ws, b.mainRow, 3, b.name, `=VLOOKUP(B${b.mainRow},AF:AH,2,FALSE)`, "s");
        setCell(ws, b.mainRow, 4, b.roundedQty, `=ROUNDUP(SUM(D${b.firstSubRow}:D${b.lastSubRow}),0)`, "n");
        setCell(ws, b.mainRow, 5, b.unit, `=VLOOKUP(B${b.mainRow},AF:AH,3,FALSE)`, "s");

        // Alt satırlar (A2 hücre taşıması + miktar hücre taşıması)
        b.subRows.forEach(sr => {
          setCell(ws, sr.excelRow, 3, sr.a2Value, sr.a2Formula, "s");
          setCell(ws, sr.excelRow, 4, Number(sr.qty.toFixed(4)), sr.qtyFormula, "n");
        });

        lastRow = b.lastSubRow + 2;
      });

      finalizeSheetRange(ws, Math.max(lastRow, 500), 34);
      ws["!cols"] = [{ wch: 8 }, { wch: 12 }, { wch: 68 }, { wch: 16 }, { wch: 14 }];
      return ws;
    }

    function exportAllToExcel() {
      const computed = computeAll();
      const wb = XLSX.utils.book_new();

      // 1. Genel Metraj (Birebir yapı ve canlı formüllerle)
      const gmWs = buildGenelMetrajExcelSheet(computed);
      XLSX.utils.book_append_sheet(wb, gmWs, "Genel Metraj");

      // 2. Eklenen Birim Metrajlar (Birebir yapı ve canlı formüllerle)
      unitModules.forEach(mod => {
        const res = computed.modResults[mod.id];
        let ws = null;
        if (mod.type === "hat") ws = buildHatExcelSheet(mod, res);
        else if (mod.type === "hat_gomlek") ws = buildHatGomlekExcelSheet(mod, res);
        else if (mod.type === "su_alim") ws = buildSuAlimExcelSheet(mod, res);
        else ws = buildSulamaExcelSheet(mod, res);
        XLSX.utils.book_append_sheet(wb, ws, mod.sheetName);
      });

      XLSX.writeFile(wb, "Metraj_Tablolari.xlsx");
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderAll();
    });
